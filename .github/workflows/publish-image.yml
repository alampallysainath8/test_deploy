# ==============================================================================
# GitHub Actions Workflow: Build and Publish Docker Image to GHCR
# ==============================================================================
# Purpose:
#   Automatically builds a production-ready Docker image and pushes it to
#   GitHub Container Registry (ghcr.io) whenever code is merged to 'main'.
# ==============================================================================

name: Publish Docker Image

# Trigger: Only on direct pushes / merges to the 'main' branch.
# We explicitly do NOT run this on Pull Requests to avoid publishing untrusted code.
on:
  push:
    branches: [ "main" ]

# Least-Privilege Permissions:
# - contents: read  -> Read access to clone and inspect repository files.
# - packages: write -> Write access to push container images to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Runs on a clean, isolated GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      # Initializes BuildKit, Docker's next-generation build engine, which provides
      # advanced caching, parallel builds, and modern image building features.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with GitHub Container Registry (GHCR)
      # Uses the built-in ephemeral GITHUB_TOKEN generated automatically by GitHub Actions.
      # No personal access tokens (PAT) or manual secrets are needed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Extract metadata and construct image tags
      # Dynamically creates tags based on the repository name (in lowercase):
      # 1. Full Git commit SHA (e.g. 45f650...) -> For immutable, traceable versioning.
      # 2. 'latest' -> Points to the most recent stable build on 'main'.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      # Step 5: Build and push the container image to GHCR
      # Compiles the Dockerfile using Buildx, applies the generated tags and OCI labels,
      # and pushes the finished image directly to ghcr.io/<owner>/<repo>.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
